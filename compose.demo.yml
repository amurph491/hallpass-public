name: hallpass-demo

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: authai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      HALLPASS_APP_PASSWORD_FILE: /run/secrets/db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d authai"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      # PostgreSQL 18 moved PGDATA beneath this version-aware mount point.
      - hallpass-postgres-data:/var/lib/postgresql
      - ./docker/postgres/init/001-create-application-role.sh:/docker-entrypoint-initdb.d/001-create-application-role.sh:ro
      - ./docker/postgres/bootstrap/application-role.sql:/opt/hallpass-bootstrap/application-role.sql:ro
    secrets:
      - db_password
    restart: unless-stopped

  hallpass-demo-server:
    build:
      context: .
      dockerfile: Dockerfile.demo-api
    expose:
      - "8080"
    ports:
      # The agent listener is reachable by a local bridge, never by the network.
      - "127.0.0.1:${HALLPASS_AGENT_PORT:-8081}:8081"
    extra_hosts:
      # Development only: lets the API reach a fake GitHub on the host.
      - "host.docker.internal:host-gateway"
    environment:
      # Development only. host.docker.internal also resolves to an IPv6 address that is unreachable on some hosts;
      # set -Djava.net.preferIPv4Stack=true here when reaching a fake provider on the host.
      JAVA_TOOL_OPTIONS: ${HALLPASS_JAVA_TOOL_OPTIONS:-}
      HALLPASS_DB_URL: jdbc:postgresql://postgres:5432/authai
      HALLPASS_DB_USER: hallpass
      HALLPASS_DB_PASSWORD_FILE: /run/secrets/db_password
      # OAuth remains disabled until a Slack client ID is configured.
      HALLPASS_SLACK_CLIENT_ID: ${HALLPASS_SLACK_CLIENT_ID:-}
      # GitHub stays off until HALLPASS_GITHUB_APP_ID is set in .env (see docs/runbooks/local-compose.md). The App's
      # private key and client secret are mounted files only. The API/WEB URL overrides are for a fake provider.
      HALLPASS_GITHUB_APP_ID: ${HALLPASS_GITHUB_APP_ID:-}
      HALLPASS_GITHUB_CLIENT_ID: ${HALLPASS_GITHUB_CLIENT_ID:-}
      HALLPASS_GITHUB_APP_SLUG: ${HALLPASS_GITHUB_APP_SLUG:-}
      HALLPASS_GITHUB_REDIRECT_URI: ${HALLPASS_GITHUB_REDIRECT_URI:-http://localhost:${HALLPASS_UI_PORT:-3000}/api/oauth/github/callback}
      HALLPASS_GITHUB_PRIVATE_KEY_FILE: /run/secrets/github_app_private_key
      HALLPASS_GITHUB_CLIENT_SECRET_FILE: /run/secrets/github_client_secret
      HALLPASS_GITHUB_API_URL: ${HALLPASS_GITHUB_API_URL:-}
      HALLPASS_GITHUB_WEB_URL: ${HALLPASS_GITHUB_WEB_URL:-}
      # Linear stays off until HALLPASS_LINEAR_CLIENT_ID is set in .env (see docs/runbooks/local-compose.md). The client
      # secret is a mounted file only. The *_URL overrides are for a fake provider.
      HALLPASS_LINEAR_CLIENT_ID: ${HALLPASS_LINEAR_CLIENT_ID:-}
      HALLPASS_LINEAR_REDIRECT_URI: ${HALLPASS_LINEAR_REDIRECT_URI:-http://localhost:${HALLPASS_UI_PORT:-3000}/api/oauth/linear/callback}
      HALLPASS_LINEAR_CLIENT_SECRET_FILE: /run/secrets/linear_client_secret
      HALLPASS_LINEAR_AUTHORIZE_URL: ${HALLPASS_LINEAR_AUTHORIZE_URL:-}
      HALLPASS_LINEAR_EXCHANGE_URL: ${HALLPASS_LINEAR_EXCHANGE_URL:-}
      HALLPASS_LINEAR_GRAPHQL_URL: ${HALLPASS_LINEAR_GRAPHQL_URL:-}
      # Notion stays off until HALLPASS_NOTION_CLIENT_ID is set in .env (see docs/runbooks/local-compose.md). The client
      # secret is a mounted file only. The *_URL overrides are for a fake provider.
      HALLPASS_NOTION_CLIENT_ID: ${HALLPASS_NOTION_CLIENT_ID:-}
      HALLPASS_NOTION_REDIRECT_URI: ${HALLPASS_NOTION_REDIRECT_URI:-http://localhost:${HALLPASS_UI_PORT:-3000}/api/oauth/notion/callback}
      HALLPASS_NOTION_CLIENT_SECRET_FILE: /run/secrets/notion_client_secret
      HALLPASS_NOTION_AUTHORIZE_URL: ${HALLPASS_NOTION_AUTHORIZE_URL:-}
      HALLPASS_NOTION_API_URL: ${HALLPASS_NOTION_API_URL:-}
      # Google Drive stays off until HALLPASS_GOOGLE_DRIVE_CLIENT_ID is set in .env (see docs/runbooks/local-compose.md). The
      # client secret is a mounted file only. The Picker API key and project number are browser-visible, not secret.
      # The *_URL overrides are for a fake provider.
      HALLPASS_GOOGLE_DRIVE_CLIENT_ID: ${HALLPASS_GOOGLE_DRIVE_CLIENT_ID:-}
      HALLPASS_GOOGLE_DRIVE_REDIRECT_URI: ${HALLPASS_GOOGLE_DRIVE_REDIRECT_URI:-http://localhost:${HALLPASS_UI_PORT:-3000}/api/oauth/google/callback}
      HALLPASS_GOOGLE_DRIVE_CLIENT_SECRET_FILE: /run/secrets/google_drive_client_secret
      HALLPASS_GOOGLE_PICKER_API_KEY: ${HALLPASS_GOOGLE_PICKER_API_KEY:-}
      HALLPASS_GOOGLE_PICKER_APP_ID: ${HALLPASS_GOOGLE_PICKER_APP_ID:-}
      HALLPASS_GOOGLE_GMAIL_SEND_ENABLED: ${HALLPASS_GOOGLE_GMAIL_SEND_ENABLED:-false}
      HALLPASS_GOOGLE_AUTHORIZE_URL: ${HALLPASS_GOOGLE_AUTHORIZE_URL:-}
      HALLPASS_GOOGLE_EXCHANGE_URL: ${HALLPASS_GOOGLE_EXCHANGE_URL:-}
      HALLPASS_GOOGLE_USERINFO_URL: ${HALLPASS_GOOGLE_USERINFO_URL:-}
      HALLPASS_GOOGLE_DRIVE_API_URL: ${HALLPASS_GOOGLE_DRIVE_API_URL:-}
      # HubSpot stays off until HALLPASS_HUBSPOT_CLIENT_ID is set in .env (see docs/runbooks/local-compose.md). The client
      # secret is a mounted file only. The *_URL overrides are for a fake provider.
      HALLPASS_HUBSPOT_CLIENT_ID: ${HALLPASS_HUBSPOT_CLIENT_ID:-}
      HALLPASS_HUBSPOT_REDIRECT_URI: ${HALLPASS_HUBSPOT_REDIRECT_URI:-http://localhost:${HALLPASS_UI_PORT:-3000}/api/oauth/hubspot/callback}
      HALLPASS_HUBSPOT_CLIENT_SECRET_FILE: /run/secrets/hubspot_client_secret
      HALLPASS_HUBSPOT_AUTHORIZE_URL: ${HALLPASS_HUBSPOT_AUTHORIZE_URL:-}
      HALLPASS_HUBSPOT_API_URL: ${HALLPASS_HUBSPOT_API_URL:-}
      # The file-backed encrypted secret store is explicitly limited to local development.
      HALLPASS_ENV: development
      HALLPASS_SLACK_CLIENT_SECRET_FILE: /run/secrets/slack_client_secret
      HALLPASS_SLACK_REDIRECT_URI: ${HALLPASS_SLACK_REDIRECT_URI:-http://localhost:${HALLPASS_UI_PORT:-3000}/api/oauth/slack/callback}
      HALLPASS_SECRET_MASTER_KEY_FILE: /run/secrets/secret_master_key
      HALLPASS_SECRET_DIRECTORY: /var/lib/hallpass-secrets
      HALLPASS_AGENT_CREDENTIAL_KEYS_FILE: /run/secrets/agent_credential_keys
      # The container must accept the loopback-published host port on its internal interface.
      HALLPASS_AGENT_HTTP_BIND_HOST: 0.0.0.0
      # Set HALLPASS_ADMIN_BOOTSTRAP_FILE= (empty) in .env to disable the shared bootstrap login and use OIDC only.
      HALLPASS_ADMIN_BOOTSTRAP_FILE: ${HALLPASS_ADMIN_BOOTSTRAP_FILE-/run/secrets/admin_bootstrap}
      # Where client machines reach the agent API, shown in the admin UI's setup commands. It must match the published
      # agent port (HALLPASS_AGENT_PORT). Only http://127.0.0.1:<port> or https://<host>[:port] is accepted.
      HALLPASS_AGENT_PUBLIC_URL: ${HALLPASS_AGENT_PUBLIC_URL:-http://127.0.0.1:${HALLPASS_AGENT_PORT:-8081}}
      # The browser's origin. It must match the host the UI is published on (HALLPASS_UI_PORT).
      HALLPASS_ADMIN_ORIGIN: http://localhost:${HALLPASS_UI_PORT:-3000}
      # Optional single sign-on (for example Google: https://accounts.google.com). Empty values leave OIDC off; the
      # bootstrap login above stays available locally. The redirect URI to register is
      # http://localhost:<HALLPASS_UI_PORT>/api/auth/oidc/callback. An empty client secret file means a public client.
      HALLPASS_OIDC_ISSUER: ${HALLPASS_OIDC_ISSUER:-}
      HALLPASS_OIDC_CLIENT_ID: ${HALLPASS_OIDC_CLIENT_ID:-}
      HALLPASS_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      # Optional telemetry export (for example Grafana Cloud's OTLP gateway). Empty leaves telemetry off. A collector
      # that needs credentials reads them from a file: set HALLPASS_OTLP_HEADERS_FILE=/run/secrets/otlp_headers in .env
      # and put the headers in .secrets/otlp_headers (OTEL_EXPORTER_OTLP_HEADERS format).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: hallpass-api-local
      HALLPASS_OTLP_HEADERS_FILE: ${HALLPASS_OTLP_HEADERS_FILE:-}
    volumes:
      # Deliberately mounted only here: neither PostgreSQL nor the UI can inspect brokered credentials.
      - hallpass-demo-secrets:/var/lib/hallpass-secrets
    secrets:
      - db_password
      - slack_client_secret
      - github_app_private_key
      - github_client_secret
      - linear_client_secret
      - notion_client_secret
      - google_drive_client_secret
      - hubspot_client_secret
      - secret_master_key
      - agent_credential_keys
      - admin_bootstrap
      - oidc_client_secret
      - otlp_headers
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  admin-ui:
    build:
      context: ./demo-admin
      dockerfile: Dockerfile
    depends_on:
      hallpass-demo-server:
        condition: service_started
    ports:
      - "127.0.0.1:${HALLPASS_UI_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  hallpass-postgres-data:
  hallpass-demo-secrets:

secrets:
  db_password:
    file: ./.secrets/db_password
  slack_client_secret:
    file: ./.secrets/slack_client_secret
  github_app_private_key:
    file: ./.secrets/github_app_private_key.pem
  github_client_secret:
    file: ./.secrets/github_client_secret
  linear_client_secret:
    file: ./.secrets/linear_client_secret
  notion_client_secret:
    file: ./.secrets/notion_client_secret
  google_drive_client_secret:
    file: ./.secrets/google_drive_client_secret
  hubspot_client_secret:
    file: ./.secrets/hubspot_client_secret
  secret_master_key:
    file: ./.secrets/secret_master_key
  agent_credential_keys:
    file: ./.secrets/agent_credential_keys
  admin_bootstrap:
    file: ./.secrets/admin_bootstrap
  # Both may be empty: an empty OIDC secret means a public client, and the OTLP headers are read only when
  # HALLPASS_OTLP_HEADERS_FILE points at them.
  oidc_client_secret:
    file: ./.secrets/oidc_client_secret
  otlp_headers:
    file: ./.secrets/otlp_headers
