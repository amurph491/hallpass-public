# Admin UI: static files from demo-admin's `production` target. It has no
# secrets and no API access of its own; the browser calls the API same-origin
# through the ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hallpass-admin-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hallpass-admin-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hallpass-admin-ui
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: hallpass-admin-ui
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hallpass-admin-ui
spec:
  selector:
    app.kubernetes.io/name: hallpass-admin-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hallpass-admin-ui
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hallpass-admin-ui
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              hallpass.run/ingress: "true"
      ports:
        - port: 8080
