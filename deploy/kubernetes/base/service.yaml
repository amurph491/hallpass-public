# Cluster-internal only. The overlay's ingress terminates TLS and routes the
# admin host to `management` and the agent host to `agent`.
apiVersion: v1
kind: Service
metadata:
  name: hallpass-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hallpass-api
  ports:
    - name: management
      port: 8080
      targetPort: management
    - name: agent
      port: 8081
      targetPort: agent
