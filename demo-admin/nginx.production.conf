# Production admin UI: static files only. The ingress routes /api/ on the same
# host to the Hallpass management listener, so the browser stays same-origin
# (required by the session cookie, CSRF, and Origin checks).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-src https://docs.google.com https://accounts.google.com; connect-src 'self' https://accounts.google.com https://www.googleapis.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
