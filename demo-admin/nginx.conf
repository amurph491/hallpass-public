server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep the browser same-origin with the UI; Docker DNS resolves this
    # service name on Compose's private network.
    location /api/ {
        proxy_pass http://hallpass-demo-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bridge downloads: install.sh, bridge.tar.gz, SHA256SUMS, VERSION. The sandbox deploy mounts them
    # read-only at /usr/share/nginx/downloads (deploy/sandbox/compose.host.yml), with `current` a symlink
    # to the latest build so a rebuild swaps them without recreating this container. Anywhere they are
    # not mounted, every path here is a 404. Files only: no directory listing, and never the SPA
    # fallback, so a missing file cannot be mistaken for a download.
    location = /downloads { return 404; }
    location = /downloads/ { return 404; }
    # Every release, by name: /downloads/releases/<release>/<file>. These URLs never change what they return,
    # which is what lets the installer fetch a checksum file and an archive that belong together while
    # `current` moves. (`current/RELEASE` names the release to fetch.)
    location ^~ /downloads/releases/ {
        alias /usr/share/nginx/downloads/releases/;
        autoindex off;
        limit_except GET HEAD { deny all; }
        default_type text/plain;
        charset utf-8;
        types {
            text/plain sh;
            application/gzip gz;
        }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ^~ /downloads/ {
        alias /usr/share/nginx/downloads/current/;
        autoindex off;
        limit_except GET HEAD { deny all; }
        default_type text/plain;
        charset utf-8;
        types {
            text/plain sh;
            application/gzip gz;
        }
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
